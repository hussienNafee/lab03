<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="CWA Help desk appointment form">
        <meta name="keywords" content="CWA, Help desk, appointment, student support">
        <meta name="author" content="Hussien Nafee">
        <title>CWA Help desk Appointment</title>
    </head>
    <body>
        <a href="http://www.swin.edu.au" target="_blank">Swinburne University</a>
        <img src="logo.png" alt="Swinburne University logo">
        </a>
        <h1>Help Desk Appointment Form</h1>
        <p>
            the help desk is located in Atc620.
            open from 10:30 to 19:00 monday to friday.
        </p>
        <p>
            check blackboard for when CWA tutors will be there.
        </p>
        <form method="post" action="submit_appointment.php">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date" required><br><br>

            <label for="time">Preferred Time:</label>
            <input type="time" id="time" name="time" required><br><br>

            <input type="submit" value="Submit">
        </form>
   <fieldset>

            <legend>Student details</legend>


            <p>

                <label for="studentid">Student ID</label>

                <input type="text"
                       id="studentid"
                       name="studentid"
                       pattern="[0-9]{7,10}"
                       required="required">

            </p>


            <p>

                <label for="givenname">Given Name</label>

                <input type="text"
                       id="givenname"
                       name="givenname"
                       maxlength="15"
                       pattern="[A-Za-z]+"
                       required="required">


                <label for="familyname">Family Name</label>

                <input type="text"
                       id="familyname"
                       name="familyname"
                       maxlength="15"
                       pattern="[A-Za-z]+"
                       required="required">

            </p>


        </fieldset>


        <fieldset>

            <legend>Your unit</legend>


            <p>

                <input type="radio"
                       id="cos10011"
                       name="unit"
                       value="COS10011"
                       required="required">

                <label for="cos10011">COS10011</label>


                <input type="radio"
                       id="cos60004"
                       name="unit"
                       value="COS60004">

                <label for="cos60004">COS60004</label>


                <input type="radio"
                       id="cos60007"
                       name="unit"
                       value="COS60007">

                <label for="cos60007">COS60007</label>

            </p>


            <p>

                <label for="tutor">Your Tutor</label>

                <select id="tutor"
                        name="tutor"
                        required="required">

                    <option value="">Please Select</option>

                    <option value="nizar">Nizar</option>

                    <option value="faisal">Faisal</option>

                    <option value="mubashir">Mubashir</option>

                </select>

            </p>


        </fieldset>


        <fieldset>

            <legend>Issue</legend>


            <p>

                <label for="html">HTML</label>

                <input type="checkbox"
                       id="html"
                       name="issue[]"
                       value="HTML">


                <label for="css">CSS</label>

                <input type="checkbox"
                       id="css"
                       name="issue[]"
                       value="CSS"
                       checked="checked">


                <label for="javascript">JavaScript</label>

                <input type="checkbox"
                       id="javascript"
                       name="issue[]"
                       value="JavaScript">


                <label for="php">PHP</label>

                <input type="checkbox"
                       id="php"
                       name="issue[]"
                       value="PHP">


                <label for="mysql">MySQL</label>

                <input type="checkbox"
                       id="mysql"
                       name="issue[]"
                       value="MySQL">

            </p>


            <p>

                <label for="description">Description of Issue</label>

                <br>

                <textarea id="description"
                          name="description"
                          rows="4"
                          cols="40"
                          placeholder="Write description of your problem here..."></textarea>

            </p>


        </fieldset>


        <fieldset>

            <legend>Preferred Date / Time</legend>


            <p>

                <label for="date">Date</label>

                <input type="text"
                       id="date"
                       name="date"
                       placeholder="dd/mm/yyyy"
                       pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
                       required="required">


                <br>


                <label for="time">Time</label>

                <input type="text"
                       id="time"
                       name="time"
                       placeholder="00:00"
                       pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
                       required="required">

            </p>


        </fieldset>


        <p>

            <input type="submit" value="Book">

            <input type="reset" value="Reset form">

        </p>


    </form>


</body>


</html>
